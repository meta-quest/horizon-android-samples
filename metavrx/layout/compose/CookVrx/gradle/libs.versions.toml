[versions]
agp = "8.6.1"
kotlin = "2.2.0"
composeBom = "2026.04.01"
activity = "1.10.1"
lifecycle = "2.9.4"
coroutines = "1.10.2"
metavrx-bom = "1.2026.0.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
metavrx-layout-compose-compat = { module = "com.meta.metavrx.layout:layout-compose-compat" }
metavrx-layout-window-compose-compat = { module = "com.meta.metavrx.layout:layout-window-compose-compat" }
metavrx-bom = { module = "com.meta.metavrx:metavrx-bom", version.ref = "metavrx-bom" }
metavrx-uiset-compose-compat = { module = "com.meta.metavrx.uiset:uiset-compose-compat" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
